<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitLog — 디자인 파이널 시안 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   FitLog 디자인 파이널 v2 (Chunk 2.5)
   톤: 조용히 고급스러운 × 완벽한 정렬 · 정돈감
   v2 변경 (수영 피드백):
   - 헤어라인 폐기 → 면의 밝기 단차로 구분 (블루 램프 = 색이자 구조)
   - 블루 모노크롬 램프 5단 — 색상은 하나, 농도로 변주 (노트 색 규칙)
   - 입력칸 존재감 강화 (밝은 면 + 큰 숫자 22px)
   - 선은 기능적 순간에만: 포커스 링 · "+ 세트" 점선
   ============================================================ */
:root {
  /* 블루 램프 — 어두운 곳부터. 이 5면 + 악센트가 화면의 전부 */
  --b-bg: #090b0e;        /* 페이지 */
  --b-card: #131921;      /* 카드 */
  --b-well: #1e2833;      /* 입력칸·세그 트랙 */
  --b-active: #324255;    /* 활성 상태 면 */
  --acc: #9db8cf;         /* 가장 밝은 한 음 — 신기록 · 주 버튼 */
  --acc-soft: rgba(157, 184, 207, .12);
  --on-acc: #0c1218;
  /* 텍스트 (블루 틴트 3단) */
  --tx: #eaf0f5;
  --mid: #93a2b1;
  --dim: #5c6b7a;
  /* 기능적 선 (포커스·점선 전용) */
  --dash: #45566a;
  /* 타입 스케일 6단계 고정 */
  --fs-micro: 11px;
  --fs-small: 13px;
  --fs-body: 15px;
  --fs-section: 18px;
  --fs-title: 22px;
  --fs-display: 30px;
  --font-num: 'Archivo', sans-serif;
  --font-body: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--b-bg);
  color: var(--tx);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
input { font-family: inherit; outline: none; border: none; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

[data-anim] { opacity: 0; transform: translateY(12px); animation: settle .5s cubic-bezier(.22,.61,.21,1) forwards; }
@keyframes settle { to { opacity: 1; transform: none; } }

.wrap { max-width: 440px; margin: 0 auto; padding: calc(var(--safe-top) + 16px) 16px 120px; }

/* ---------- 헤더 ---------- */
.hd { padding: 8px 4px 24px; }
.logo {
  font-family: var(--font-num); font-size: var(--fs-small); font-weight: 700;
  letter-spacing: .22em; color: var(--mid);
}
.hd-date { font-size: var(--fs-title); font-weight: 700; letter-spacing: -.03em; margin-top: 16px; }
.hd-date small { font-size: var(--fs-small); font-weight: 400; color: var(--mid); margin-left: 8px; letter-spacing: 0; }

/* ---------- 카드: 선 없음, 면 단차로만 ---------- */
.card {
  background: var(--b-card);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 8px;
}

/* ---------- 컨디션 ---------- */
.cond { display: flex; align-items: baseline; gap: 16px; }
.cond .k { font-size: var(--fs-small); font-weight: 600; color: var(--mid); }
.cond .v { font-size: var(--fs-title); font-weight: 600; letter-spacing: -.02em; }
.cond .v small { font-size: var(--fs-micro); font-weight: 600; color: var(--dim); }
.cond .note { margin-left: auto; font-size: var(--fs-small); color: var(--mid); }
.cond .arr { font-size: 10px; color: var(--dim); }

/* ---------- 세션 ---------- */
.sess-top { display: flex; align-items: baseline; margin-bottom: 16px; }
.sess-top .k { font-size: var(--fs-small); font-weight: 600; color: var(--mid); }
.sess-top .time { margin-left: auto; font-size: var(--fs-small); color: var(--mid); }
.sess-top .time b { color: var(--tx); font-weight: 600; }
.seg2 { display: flex; background: var(--b-well); border-radius: 10px; padding: 2px; }
.seg2 button {
  flex: 1; padding: 8px 0; border-radius: 8px;
  font-size: var(--fs-small); font-weight: 600; color: var(--dim);
  transition: color .15s;
}
.seg2 button.on { background: var(--b-active); color: var(--tx); font-weight: 700; }

/* ---------- 운동 카드 ---------- */
.ex { padding-bottom: 8px; }
.ex-hd { display: flex; align-items: baseline; gap: 8px; }
.part { font-size: var(--fs-micro); font-weight: 600; letter-spacing: .12em; color: var(--mid); }
.ex-name { font-size: var(--fs-section); font-weight: 700; letter-spacing: -.02em; }
.ex-x { margin-left: auto; color: var(--dim); font-size: var(--fs-small); font-weight: 600; padding: 0 4px; }

/* 지난기록 토글 — 신기록 = 가장 밝은 한 음 ① */
.pr {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: var(--acc-soft); border-radius: 10px; padding: 8px 12px; margin-top: 12px;
}
.pr .tag { font-size: var(--fs-micro); font-weight: 600; letter-spacing: .12em; color: var(--acc); }
.pr .v { font-size: var(--fs-small); color: var(--mid); }
.pr .v b { color: var(--tx); font-weight: 600; }
.pr .arr { margin-left: auto; font-size: 10px; color: var(--dim); transition: transform .2s; }
.pr.open .arr { transform: rotate(180deg); }
.hist { display: none; padding: 8px 12px 0; }
.hist.show { display: block; }
.hist .h-date { font-size: var(--fs-micro); font-weight: 600; letter-spacing: .12em; color: var(--dim); margin-bottom: 4px; }
.hist .h-set { display: flex; gap: 12px; font-size: var(--fs-small); color: var(--mid); padding: 2px 0; }
.hist .h-set b { color: var(--tx); font-weight: 600; }

/* 세트 그리드 — 큰 숫자가 주인공 */
.set-hd, .set-row { display: grid; grid-template-columns: 16px 80px 1fr 1fr 24px; gap: 8px; align-items: center; }
.set-hd { padding: 16px 0 8px; font-size: var(--fs-micro); letter-spacing: .1em; color: var(--dim); text-align: center; font-weight: 600; }
.set-row { padding: 4px 0; }
.set-num { font-family: var(--font-num); font-size: var(--fs-small); font-weight: 600; color: var(--dim); text-align: center; }
.seg3 { display: flex; background: var(--b-well); border-radius: 10px; padding: 2px; }
.seg3 button { flex: 1; font-size: var(--fs-micro); padding: 8px 0; border-radius: 8px; color: var(--dim); }
.seg3 button.on { background: var(--b-active); color: var(--tx); font-weight: 700; }
.inp {
  width: 100%; background: var(--b-well); border-radius: 10px;
  color: var(--tx); font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: var(--fs-title); font-weight: 400; letter-spacing: -.02em;
  text-align: center; padding: 8px 4px;
}
.inp:focus { box-shadow: 0 0 0 2px var(--acc); }
.del { color: var(--dim); text-align: center; font-size: var(--fs-small); font-weight: 600; }
.add-set {
  display: block; width: 100%; margin-top: 8px; padding: 8px 0; border-radius: 10px;
  border: 2px dashed var(--dash); color: var(--mid); font-size: var(--fs-small); font-weight: 600;
}

/* 횟수/초 토글 — 세트 유형 (setType: reps|seconds) */
.type-seg { display: inline-flex; background: var(--b-well); border-radius: 10px; padding: 2px; margin-top: 12px; }
.type-seg button { font-size: var(--fs-micro); font-weight: 600; padding: 4px 16px; border-radius: 8px; color: var(--dim); }
.type-seg button.on { background: var(--b-active); color: var(--tx); font-weight: 700; }

/* 주 버튼 — 가장 밝은 한 음 ② */
.add-row { display: flex; gap: 8px; margin-top: 16px; }
.add-row button {
  flex: 1; padding: 16px 0; border-radius: 10px;
  font-size: var(--fs-body); font-weight: 700; letter-spacing: -.01em;
  background: var(--acc); color: var(--on-acc);
}
.add-row button.alt { background: var(--b-card); color: var(--mid); }

/* ---------- 탭바: 선 대신 면 ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: rgba(19,25,33,.92);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding: 8px 16px calc(var(--safe-bottom) + 8px);
}
.tabbar .track { display: flex; background: var(--b-well); border-radius: 10px; padding: 2px; max-width: 408px; margin: 0 auto; }
.tabbar button { flex: 1; padding: 12px 0; border-radius: 8px; font-size: var(--fs-small); font-weight: 600; color: var(--dim); }
.tabbar button.on { background: var(--b-active); color: var(--tx); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hd" data-anim style="animation-delay:.05s">
    <div class="logo">FITLOG</div>
    <div class="hd-date">7월 3일<small>금요일</small></div>
  </header>

  <div class="card cond" data-anim style="animation-delay:.1s">
    <span class="k">컨디션</span>
    <span class="v num">7<small> /10</small></span>
    <span class="note">몸무게 64.2kg</span>
    <span class="arr">▼</span>
  </div>

  <div class="card" data-anim style="animation-delay:.15s">
    <div class="sess-top">
      <span class="k">세션 1</span>
      <span class="time"><b class="num">18:58</b> 시작</span>
    </div>
    <div class="seg2">
      <button>PT</button>
      <button class="on">개인운동</button>
    </div>
  </div>

  <div class="card ex" data-anim style="animation-delay:.2s">
    <div class="ex-hd">
      <span class="part">하체</span>
      <span class="ex-name">스쿼트</span>
      <button class="ex-x">✕</button>
    </div>
    <div class="type-seg"><button class="on">횟수</button><button>초</button></div>
    <button class="pr" data-hist>
      <span class="tag">신기록</span>
      <span class="v"><b class="num">8kg</b> · 07-03 금</span>
      <span class="arr">▼</span>
    </button>
    <div class="hist">
      <div class="h-date">직전 07-03 금</div>
      <div class="h-set"><span><b class="num">4kg</b> × 30</span><span><b class="num">6kg</b> × 20</span><span><b class="num">8kg</b> × 20</span></div>
    </div>
    <div class="set-hd"><span></span><span>측</span><span>kg</span><span>회</span><span></span></div>
    <div class="set-row">
      <span class="set-num">1</span>
      <div class="seg3"><button class="on">양</button><button>좌</button><button>우</button></div>
      <input class="inp" inputmode="decimal" value="4">
      <input class="inp" inputmode="numeric" value="30">
      <button class="del">−</button>
    </div>
    <div class="set-row">
      <span class="set-num">2</span>
      <div class="seg3"><button class="on">양</button><button>좌</button><button>우</button></div>
      <input class="inp" inputmode="decimal" value="6">
      <input class="inp" inputmode="numeric" value="20">
      <button class="del">−</button>
    </div>
    <div class="set-row">
      <span class="set-num">3</span>
      <div class="seg3"><button class="on">양</button><button>좌</button><button>우</button></div>
      <input class="inp" inputmode="decimal" value="8">
      <input class="inp" inputmode="numeric" value="20">
      <button class="del">−</button>
    </div>
    <button class="add-set">+ 세트</button>
  </div>

  <div class="card ex" data-anim style="animation-delay:.25s">
    <div class="ex-hd">
      <span class="part">하체</span>
      <span class="ex-name">레그 프레스</span>
      <button class="ex-x">✕</button>
    </div>
    <div class="type-seg"><button class="on">횟수</button><button>초</button></div>
    <button class="pr" data-hist>
      <span class="tag">신기록</span>
      <span class="v"><b class="num">75.5kg</b> · 07-03 금</span>
      <span class="arr">▼</span>
    </button>
    <div class="hist">
      <div class="h-date">직전 06-29 월</div>
      <div class="h-set"><span><b class="num">45.5kg</b> × 15</span><span><b class="num">65.5kg</b> × 12</span><span><b class="num">65.5kg</b> × 12</span></div>
    </div>
    <div class="set-hd"><span></span><span>측</span><span>kg</span><span>회</span><span></span></div>
    <div class="set-row">
      <span class="set-num">1</span>
      <div class="seg3"><button class="on">양</button><button>좌</button><button>우</button></div>
      <input class="inp" inputmode="decimal" value="45.5">
      <input class="inp" inputmode="numeric" value="15">
      <button class="del">−</button>
    </div>
    <div class="set-row">
      <span class="set-num">2</span>
      <div class="seg3"><button class="on">양</button><button>좌</button><button>우</button></div>
      <input class="inp" inputmode="decimal" value="65.5">
      <input class="inp" inputmode="numeric" value="12">
      <button class="del">−</button>
    </div>
    <div class="set-row">
      <span class="set-num">3</span>
      <div class="seg3"><button class="on">양</button><button>좌</button><button>우</button></div>
      <input class="inp" inputmode="decimal" value="75.5">
      <input class="inp" inputmode="numeric" value="15">
      <button class="del">−</button>
    </div>
    <button class="add-set">+ 세트</button>
  </div>

  <div class="add-row" data-anim style="animation-delay:.3s">
    <button>+ 웨이트</button>
    <button class="alt">+ 유산소</button>
  </div>

</div>

<nav class="tabbar">
  <div class="track">
    <button class="on">기록</button>
    <button>캘린더</button>
    <button>분석</button>
  </div>
</nav>

<script>
document.querySelectorAll('.seg3, .seg2, .type-seg, .tabbar').forEach(function (group) {
  group.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    group.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
  });
});
document.querySelectorAll('[data-hist]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var hist = btn.parentElement.querySelector('.hist');
    var open = hist.classList.toggle('show');
    btn.classList.toggle('open', open);
  });
});
</script>
</body>
</html>
