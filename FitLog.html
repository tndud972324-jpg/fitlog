<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FitLog"/>
  <title>FitLog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #09090F; min-height: 100vh; font-family: "Noto Sans KR", sans-serif; }
    #root { padding-top: env(safe-area-inset-top); min-height: 100vh; }
    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; background: #09090F;
      gap: 12px; padding: 24px;
      padding-top: calc(40px + env(safe-area-inset-top));
    }
    #login-screen h1 { font-size: 36px; font-weight: 900; font-family: "DM Mono", monospace; letter-spacing: -1px; margin-bottom: 2px; }
    #login-screen h1 span:first-child { color: #BBFF00; }
    #login-screen h1 span:last-child { color: white; }
    #title-sub { color: #555; font-size: 13px; margin-bottom: 6px; }
    .auth-input { width: 100%; max-width: 300px; background: #111119; border: 1px solid #222; border-radius: 12px; padding: 14px 16px; color: white; font-size: 15px; font-family: "Noto Sans KR", sans-serif; outline: none; }
    .auth-input:focus { border-color: #444; }
    .auth-btn { width: 100%; max-width: 300px; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: "Noto Sans KR", sans-serif; margin-top: 4px; }
    .btn-primary { background: #BBFF00; color: #000; }
    .btn-secondary { background: #111119; color: #aaa; border: 1px solid #222; }
    .btn-text { background: none; color: #444; font-size: 12px; padding: 6px; max-width: 300px; width: 100%; border: none; cursor: pointer; font-family: "Noto Sans KR", sans-serif; }
    #auth-err { color: #FF6B6B; font-size: 12px; max-width: 300px; text-align: center; min-height: 16px; }
    #user-bar { display: none; position: fixed; top: 0; right: 0; z-index: 9999; padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top)); align-items: center; gap: 6px; }
    #user-email { color: #444; font-size: 10px; }
    #user-bar button { background: rgba(255,255,255,0.06); border: none; color: #555; font-size: 10px; padding: 3px 7px; border-radius: 5px; cursor: pointer; }
    .divider { width: 100%; max-width: 300px; border: none; border-top: 1px solid #1a1a1a; margin: 2px 0; }
  </style>
</head>
<body>
<div id="login-screen">
  <h1><span>FIT</span><span>LOG</span></h1>
  <p id="title-sub">로그인</p>
  <input id="email" class="auth-input" type="email" placeholder="이메일" autocomplete="email"/>
  <div id="pw-wrap" style="width:100%;max-width:300px">
    <input id="pw" class="auth-input" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="width:100%"/>
  </div>
  <div id="pw2-wrap" style="display:none;width:100%;max-width:300px">
    <input id="pw2" class="auth-input" type="password" placeholder="비밀번호 확인" autocomplete="new-password" style="width:100%"/>
  </div>
  <div id="auth-err"></div>
  <button id="btn-main" class="auth-btn btn-primary" onclick="handleMain()">로그인</button>
  <button id="btn-switch" class="auth-btn btn-secondary" onclick="setMode(_mode==='login'?'signup':'login')">처음이에요 — 회원가입</button>
  <hr class="divider"/>
  <button id="btn-reset" class="btn-text" onclick="setMode('reset')">비밀번호를 잊었어요</button>
</div>
<div id="user-bar" style="display:none">
  <span id="user-email"></span>
  <button onclick="auth.signOut()">로그아웃</button>
</div>
<div id="root" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB2LMW4NFGFifqBlLrFiAVkTvhsEtHkpqY",
  authDomain: "fitlog-a952b.firebaseapp.com",
  projectId: "fitlog-a952b",
  storageBucket: "fitlog-a952b.firebasestorage.app",
  messagingSenderId: "300819194132",
  appId: "1:300819194132:web:8f2c59f78e2796a3e06201"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
window._db = firebase.firestore();
window._uid = null;
let _mode = 'login';

function setMode(m) {
  _mode = m;
  const err = document.getElementById('auth-err');
  err.textContent = ''; err.style.color = '#FF6B6B';
  document.getElementById('pw2-wrap').style.display = m === 'signup' ? 'block' : 'none';
  document.getElementById('btn-main').textContent = m === 'login' ? '로그인' : m === 'signup' ? '회원가입' : '재설정 링크 보내기';
  document.getElementById('btn-switch').textContent = m === 'login' ? '처음이에요 — 회원가입' : '이미 계정이 있어요 — 로그인';
  document.getElementById('btn-reset').style.display = m === 'login' ? 'block' : 'none';
  document.getElementById('pw-wrap').style.display = m === 'reset' ? 'none' : 'block';
  document.getElementById('title-sub').textContent = m === 'login' ? '로그인' : m === 'signup' ? '회원가입' : '비밀번호 재설정';
}

function handleMain() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const err = document.getElementById('auth-err');
  err.style.color = '#FF6B6B';
  if (_mode === 'reset') {
    if (!email) { err.textContent = '이메일을 입력해주세요'; return; }
    auth.sendPasswordResetEmail(email)
      .then(() => { err.style.color = '#BBFF00'; err.textContent = '✓ ' + email + '로 재설정 링크를 보냈어요!'; })
      .catch(e => { err.textContent = '오류: ' + e.message; });
    return;
  }
  if (!email || !pw) { err.textContent = '이메일과 비밀번호를 입력해주세요'; return; }
  if (_mode === 'signup') {
    if (pw.length < 6) { err.textContent = '비밀번호는 6자 이상이어야 해요'; return; }
    if (pw !== pw2) { err.textContent = '비밀번호가 일치하지 않아요'; return; }
    err.textContent = '가입 중...';
    auth.createUserWithEmailAndPassword(email, pw)
      .catch(e => {
        if (e.code === 'auth/email-already-in-use') err.textContent = '이미 사용 중인 이메일이에요';
        else err.textContent = '오류: ' + e.message;
      });
  } else {
    err.textContent = '로그인 중...';
    auth.signInWithEmailAndPassword(email, pw)
      .catch(e => {
        if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') err.textContent = '비밀번호가 틀렸어요';
        else if (e.code === 'auth/user-not-found') err.textContent = '등록되지 않은 이메일이에요';
        else err.textContent = '오류: ' + e.message;
      });
  }
}

function showApp(user) {
  window._uid = user.uid;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('root').style.display = 'block';
  document.getElementById('user-email').textContent = user.email;
  document.getElementById('user-bar').style.display = 'flex';
  if (!window._mounted) { window._mounted = true; if (window._mountFitLog) window._mountFitLog(); }
}

function showLogin() {
  window._uid = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('root').style.display = 'none';
  document.getElementById('user-bar').style.display = 'none';
}

auth.onAuthStateChanged(user => { if (user) { showApp(user); } else { showLogin(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') handleMain();
});
</script>

<script>

const { useState, useEffect } = React;
const _RC = window.Recharts || {};
const LineChart = _RC.LineChart || (({children,...p})=>React.createElement('div',p,children));
const Line = _RC.Line || (()=>null);
const BarChart = _RC.BarChart || (({children,...p})=>React.createElement('div',p,children));

const storage = {
  get: async key => { try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; } },
  set: async (key, value) => { try { localStorage.setItem(key, value); return { key, value }; } catch { return null; } }
};

const DEFAULT_LIB = {
  '가슴': ['벤치프레스', '인클라인 벤치프레스', '덤벨 플라이', '푸시업', '케이블 크로스오버'],
  '등': ['데드리프트', '바벨 로우', '풀업', '랫풀다운', '시티드 로우'],
  '하체': ['스쿼트', '레그프레스', '레그컬', '런지', '레그 익스텐션', '카프레이즈'],
  '어깨': ['오버헤드프레스', '사이드 레터럴', '프론트 레이즈', '페이스풀', '리어 델트 플라이'],
  '팔': ['바벨 컬', '해머 컬', '트라이셉스 익스텐션', '딥스', '케이블 컬'],
  '복근': ['크런치', '레그레이즈', '플랭크', '사이드플랭크', '케이블 크런치'],
  '기타': ['케틀벨 스윙', '배틀로프', '박스점프', '버피', '팔굽혀펴기']
};
const CARDIO_LIST = ['러닝', '사이클', '수영', '로잉', '줄넘기', '계단오르기', '걷기', '인터벌', '기타'];
const PART_COLORS = { '가슴': '#FF6B6B', '등': '#5B9CF6', '하체': '#BBFF00', '어깨': '#FF9F43', '팔': '#A29BFE', '복근': '#00CEC9', '기타': '#636E72' };
const SESS_COLOR = { '개인운동': '#5B9CF6', '피티': '#BBFF00', '그룹': '#FF9F43' };
const SESS_BG   = { '개인운동': 'rgba(91,156,246,0.1)', '피티': 'rgba(187,255,0,0.1)', '그룹': 'rgba(255,159,67,0.1)' };
const SESS_DIM  = { '개인운동': 'rgba(91,156,246,0.3)', '피티': 'rgba(187,255,0,0.3)', '그룹': 'rgba(255,159,67,0.3)' };
const DAYS_KR = ['일','월','화','수','목','금','토'];

const todayStr = () => new Date().toISOString().slice(0,10);
const newId = () => Math.random().toString(36).slice(2,9);
const newSession = (type='개인운동') => ({ id: newId(), sessionType: type, notes: '', exercises: [], startTime: null, endTime: null });
const blankDay = () => ({
  date: todayStr(),
  condition: { score: 5, sleep: '', note: '' },
  nutrition: { kcal: '', protein: '', carb: '', fat: '' },
  bodyMetrics: { weight: '', bodyFat: '' },
  sessions: [newSession()]
});
const calcDuration = (start, end) => {
  if (!start || !end) return null;
  const diff = Math.round((new Date(end) - new Date(start)) / 60000);
  return diff > 0 ? diff : null;
};
const calcPace = (distKm, durMin) => {
  if (!distKm || !durMin) return null;
  const pace = durMin / distKm;
  const m = Math.floor(pace);
  const s = Math.round((pace - m) * 60).toString().padStart(2, '0');
  return `${m}'${s}"`;
};

const C = {
  bg: '#09090F', card: '#101018', border: 'rgba(255,255,255,0.06)',
  accent: '#BBFF00', blue: '#5B9CF6', orange: '#FF9F43', red: '#FF6B6B',
  mid: '#888', dim: '#444', white: '#F5F5F5'
};
const mono = '"DM Mono", "Courier New", monospace';
const sans = '"Noto Sans KR", sans-serif';
const inp = (extra={}) => ({ background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: C.white, outline: 'none', width: '100%', ...extra });
const cs  = (extra={}) => ({ background: C.card, border: `1px solid ${C.border}`, borderRadius: '14px', padding: '14px', marginBottom: '10px', ...extra });

const SL = ({ children, style, ...props }) =>
  React.createElement('div', { style: { overflowX:'auto', display:'flex', gap:'6px', paddingBottom:'4px', scrollbarWidth:'none', ...style }, ...props }, children);

const Dot = ({ color=C.accent, size=8 }) =>
  React.createElement('span', { style: { display:'inline-block', width:size, height:size, borderRadius:'50%', background:color, flexShrink:0 } });

const LDot = ({ color=C.accent }) =>
  React.createElement('span', { style: { display:'inline-block', width:10, height:10, borderRadius:'50%', background:color, flexShrink:0, marginRight:6 } });

const Seg = ({ options, value, onChange, style }) =>
  React.createElement('div', { style: { display:'flex', background:'rgba(255,255,255,0.04)', borderRadius:'10px', padding:'3px', gap:'2px', ...style } },
    options.map(opt => React.createElement('button', {
      key: opt, onClick: () => onChange(opt),
      style: { flex:1, border:'none', borderRadius:'8px', cursor:'pointer', padding:'6px 4px', fontSize:'12px', fontWeight:'700', fontFamily:sans,
               background: value===opt ? C.accent : 'transparent', color: value===opt ? '#000' : C.mid, transition:'all 0.15s' }
    }, opt))
  );

const calcStreak = (records) => {
  const dates = Object.keys(records).sort().reverse();
  if (!dates.length) return 0;
  let streak = 0;
  const today = todayStr();
  const d = new Date(today);
  for (let i=0; i<365; i++) {
    const ds = d.toISOString().slice(0,10);
    if (records[ds]) { streak++; d.setDate(d.getDate()-1); }
    else if (ds===today) { d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
};

const buildPRs = (records) => {
  const prs = {};
  Object.values(records).forEach(day => {
    (day.sessions||[]).forEach(sess => {
      (sess.exercises||[]).forEach(ex => {
        if (ex.kind !== 'strength') return;
        ex.sets.forEach(ss => {
          const w = parseFloat(ss.weight)||0;
          const r = parseInt(ss.reps)||0;
          if (w>0 && r>0) {
            const e1rm = w*(1+r/30);
            if (!prs[ex.name] || e1rm>prs[ex.name].e1rm)
              prs[ex.name] = { weight:w, reps:r, e1rm: Math.round(e1rm*10)/10 };
          }
        });
      });
    });
  });
  return prs;
};

const getStrVal = (r, m) => {
  return r.sessions?.reduce((t,s) => t + (s.exercises?.reduce((sum,ex) => {
    if (ex.kind!=='strength') return sum;
    return sum + (m==='volume'
      ? ex.sets.reduce((s2,ss)=>s2+(parseFloat(ss.weight)||0)*(parseInt(ss.reps)||0), 0)
      : ex.sets.length);
  },0)||0), 0)||0;
};

const wkBounds = (offset=0) => {
  const now = new Date();
  now.setDate(now.getDate() - now.getDay() + offset*7);
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay());
  const dates=[];
  for (let i=0;i<7;i++) { const d=new Date(start); d.setDate(start.getDate()+i); dates.push(d.toISOString().slice(0,10)); }
  return dates;
};

const fmtV = v => v>=1000 ? `${(v/1000).toFixed(1)}t` : `${v}kg`;
const mU = (m,u) => `${m}${u}`;

function FitLog() {
  const [tab, setTab] = useState('record');
  const [day, setDay] = useState(blankDay());
  const [records, setRecords] = useState({});
  const [exLib, setExLib] = useState(DEFAULT_LIB);
  const [flash, setFlash] = useState('');
  const [picker, setPicker] = useState(null);
  const [histOpen, setHistOpen] = useState(null);
  const [calDate, setCalDate] = useState(todayStr().slice(0,7));
  const [calSel, setCalSel] = useState(null);
  const [wkOff, setWkOff] = useState(0);
  const [analysis, setAnalysis] = useState({ metric:'volume', exName:'' });
  const [customInput, setCustomInput] = useState({});

  useEffect(() => { initData(); }, []);

  const initData = async () => {
    try {
      const r = await storage.get('fl4-records'); if (r) setRecords(JSON.parse(r.value));
      const l = await storage.get('fl4-exlib');   if (l) setExLib(JSON.parse(l.value));
      const saved = await storage.get('fl4-day-'+todayStr()); if (saved) setDay(JSON.parse(saved.value));
    } catch {}
  };

  const showFlash = msg => { setFlash(msg); setTimeout(()=>setFlash(''), 2000); };
  const persist = async newDay => { try { await storage.set('fl4-day-'+newDay.date, JSON.stringify(newDay)); } catch {} };

  const setCond = (field,val) => setDay(d => { const n={...d, condition:{...d.condition,[field]:val}}; persist(n); return n; });
  const setNut  = (field,val) => setDay(d => { const n={...d, nutrition:{...d.nutrition,[field]:val}}; persist(n); return n; });
  const setBM   = (field,val) => setDay(d => { const n={...d, bodyMetrics:{...d.bodyMetrics,[field]:val}}; persist(n); return n; });

  const onDateChange = async e => {
    await persist(day);
    const ds = e.target.value;
    const saved = await storage.get('fl4-day-'+ds);
    if (saved) setDay(JSON.parse(saved.value)); else setDay({...blankDay(), date:ds});
  };

  const updSess = (id,field,val) => setDay(d => { const n={...d, sessions:d.sessions.map(s=>s.id!==id?s:{...s,[field]:val})}; persist(n); return n; });
  const addSess = type => setDay(d => { const n={...d, sessions:[...d.sessions, newSession(type)]}; persist(n); return n; });
  const rmSess  = id   => setDay(d => { const n={...d, sessions:d.sessions.filter(s=>s.id!==id)}; persist(n); return n; });

  const addEx = (sessId,ex) => setDay(d => { const n={...d, sessions:d.sessions.map(s=>s.id!==sessId?s:{...s,exercises:[...s.exercises,{...ex,id:newId()}]})}; persist(n); return n; });
  const updEx = (sessId,ei,field,val) => setDay(d => { const n={...d,sessions:d.sessions.map(s=>s.id!==sessId?s:{...s,exercises:s.exercises.map((ex,i)=>i!==ei?ex:{...ex,[field]:val})})}; persist(n); return n; });
  const rmEx  = (sessId,ei) => setDay(d => { const n={...d,sessions:d.sessions.map(s=>s.id!==sessId?s:{...s,exercises:s.exercises.filter((_,i)=>i!==ei)})}; persist(n); return n; });

  // ── CHANGE 1: addSet adds type/side/seconds ───────────────────────────────
  const addSet = (sessId,ei) => setDay(d => ({
    ...d,
    sessions: d.sessions.map(s=>s.id!==sessId?s:{
      ...s,
      exercises: s.exercises.map((ex,i)=>i!==ei?ex:{
        ...ex,
        sets: [...ex.sets, { weight:'', reps:'', seconds:'', type:'reps', side:'both' }]
      })
    })
  }));

  const updSet = (sessId,ei,si,field,val) => setDay(d => {
    const n={...d,sessions:d.sessions.map(s=>s.id!==sessId?s:{...s,exercises:s.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((ss,k)=>k!==si?ss:{...ss,[field]:val})})})};
    persist(n); return n;
  });
  const rmSet = (sessId,ei,si) => setDay(d => {
    const n={...d,sessions:d.sessions.map(s=>s.id!==sessId?s:{...s,exercises:s.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.filter((_,k)=>k!==si)})})};
    persist(n); return n;
  });

  // ── CHANGE 2: addCustomStr initial set ────────────────────────────────────
  const addCustomStr = async (sessId,part,name) => {
    if (!name.trim()) return;
    const upd={...exLib,[part]:[...(exLib[part]||[]),name.trim()]};
    try { await storage.set('fl4-exlib', JSON.stringify(upd)); } catch {}
    setExLib(upd);
    addEx(sessId, { kind:'strength', bodyPart:part, name:name.trim(),
      sets:[{ weight:'', reps:'', seconds:'', type:'reps', side:'both' }] });
  };

  const save = async () => {
    await persist(day);
    const newRecs={...records,[day.date]:day};
    setRecords(newRecs);
    try { await storage.set('fl4-records', JSON.stringify(newRecs)); } catch {}
    showFlash('✓ 저장됨');
  };

      ),
      // Cal popup
      calSel && records[calSel] && React.createElement('div', {
        style:{ position:'fixed', inset:0, background:'rgba(0,0,0,0.85)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:'20px' },
        onClick:e=>{ if(e.target===e.currentTarget) setCalSel(null); }
      },
        React.createElement('div', { style:{ background:C.card, borderRadius:'16px', padding:'20px', width:'100%', maxWidth:390, maxHeight:'80vh', overflowY:'auto' } },
          React.createElement('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px' } },
            React.createElement('div', { style:{ fontFamily:mono, fontWeight:'700', color:C.white } }, calSel),
            React.createElement('button', { onClick:()=>setCalSel(null), style:{ background:'none', border:'none', color:C.mid, cursor:'pointer', fontSize:'20px' } }, '×')
          ),
          (records[calSel].sessions||[]).map((sess,i)=>
            React.createElement('div', { key:i, style:{ marginBottom:'10px' } },
              React.createElement('div', { style:{ fontSize:'12px', color: SESS_COLOR[sess.sessionType]||C.mid, fontWeight:'700', marginBottom:'6px' } }, sess.sessionType),
              (sess.exercises||[]).map((ex,j)=>
                React.createElement('div', { key:j, style:{ marginBottom:'6px', paddingLeft:'8px' } },
                  React.createElement('div', { style:{ display:'flex', alignItems:'center', gap:'6px', marginBottom:'3px' } },
                    React.createElement(Dot, { color: PART_COLORS[ex.bodyPart]||C.mid, size:6 }),
                    React.createElement('span', { style:{ fontSize:'13px', color:C.white, fontWeight:'600' } }, ex.name),
                    ex.kind==='strength' && React.createElement('span', { style:{ fontFamily:mono, fontSize:'11px', color:C.dim } }, `(${ex.sets.length}세트)`)
                  ),
                  ex.kind==='cardio' && React.createElement('div', { style:{ fontSize:'11px', color:C.mid, paddingLeft:'12px' } },
                    [ex.distKm&&`${ex.distKm}km`, ex.durMin&&`${ex.durMin}분`].filter(Boolean).join(' · ')
                  )
                )
              )
            )
          ),
          React.createElement('button', { onClick:()=>{ loadDay(calSel); setCalSel(null); },
            style:{ background:C.accent, border:'none', borderRadius:'10px', color:'#000', cursor:'pointer', padding:'10px', width:'100%', fontSize:'13px', fontWeight:'800', fontFamily:sans, marginTop:'8px' } },
            '이날 기록 보기')
        )
      )
    );

  // HISTORY TAB
  const renderHistory = () =>
    React.createElement('div', { style:W },
      React.createElement('div', { style:{ padding:'14px 0 10px', fontSize:'16px', fontWeight:'700', color:C.white, fontFamily:mono } }, '기록'),
      histDates.length===0 && React.createElement('div', { style:{ color:C.dim, textAlign:'center', padding:'40px', fontSize:'13px' } }, '저장된 기록이 없어요'),
      histDates.map(date=>
        React.createElement('div', { key:date, style:cs() },
          React.createElement('button', {
            onClick:()=>setHistOpen(histOpen===date?null:date),
            style:{ background:'none', border:'none', width:'100%', textAlign:'left', cursor:'pointer', display:'flex', alignItems:'center', gap:'8px' } },
            React.createElement('span', { style:{ fontFamily:mono, fontWeight:'700', color:C.white, fontSize:'14px', flex:1 } }, date),
            React.createElement('span', { style:{ fontSize:'10px', color:C.mid } },
              (records[date].sessions||[]).reduce((t,s)=>t+(s.exercises||[]).length,0)+'개 운동'),
            React.createElement('span', { style:{ color:C.dim, fontSize:'14px' } }, histOpen===date?'▲':'▼')
          ),
          histOpen===date && React.createElement('div', { style:{ marginTop:'12px' } },
            (records[date].sessions||[]).map((sess,si)=>
              React.createElement('div', { key:si, style:{ marginBottom:'10px' } },
                React.createElement('div', { style:{ fontSize:'11px', fontWeight:'700', color: SESS_COLOR[sess.sessionType]||C.mid, marginBottom:'6px' } }, sess.sessionType),
                (sess.exercises||[]).map((ex,ei)=>
                  React.createElement('div', { key:ei, style:{ marginBottom:'8px', paddingLeft:'8px' } },
                    React.createElement('div', { style:{ display:'flex', alignItems:'center', gap:'5px', marginBottom:'4px' } },
                      React.createElement(LDot, { color: PART_COLORS[ex.bodyPart]||C.mid }),
                      React.createElement('span', { style:{ fontSize:'13px', fontWeight:'700', color:C.white } }, ex.name)
                    ),
                    // ── CHANGE 5: history set display ──────────────────────
                    ex.kind==='strength' && ex.sets.map((ss,k)=>{
                      const sType = ss.type||'reps';
                      const sSide = ss.side||'both';
                      const sideLabel = sSide==='left'?' (왼)':sSide==='right'?' (오)':'';
                      const valLabel  = sType==='time'
                        ? `${ss.seconds||0}초${sideLabel}`
                        : `${ss.weight}kg × ${ss.reps}회${sideLabel}`;
                      return React.createElement('div', { key:k, style:{ fontSize:'12px', color:C.mid, fontFamily:mono, paddingLeft:'16px' } },
                        `세트${k+1}: ${valLabel}`);
                    }),
                    ex.kind==='cardio' && React.createElement('div', { style:{ fontSize:'12px', color:C.mid, fontFamily:mono, paddingLeft:'16px' } },
                      [ex.distKm&&`${ex.distKm}km`, ex.durMin&&`${ex.durMin}분`, ex.distKm&&ex.durMin&&`페이스 ${calcPace(parseFloat(ex.distKm),parseFloat(ex.durMin))}`].filter(Boolean).join(' · ')
                    )
                  )
                )
              )
            ),
            React.createElement('button', { onClick:()=>loadDay(date),
              style:{ background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:'8px', color:C.mid, cursor:'pointer', padding:'8px', width:'100%', fontSize:'12px', fontFamily:sans, marginTop:'4px' } },
              '이날 기록 수정')
          )
        )
      )
    );

  // ANALYSIS TAB
  const renderAnalysis = () => {
    const allDates = Object.keys(records).sort();
    const wt = allDates.map(d=>({ date:d.slice(5), weight: parseFloat(records[d].bodyMetrics?.weight)||null })).filter(d=>d.weight);
    return React.createElement('div', { style:W },
      React.createElement('div', { style:{ padding:'14px 0 6px', fontSize:'16px', fontWeight:'700', color:C.white, fontFamily:mono } }, '분석'),

      // Streak + PRs
      React.createElement('div', { style:cs({ display:'flex', gap:'12px', alignItems:'center' }) },
        React.createElement('div', { style:{ textAlign:'center', flex:1 } },
          React.createElement('div', { style:{ fontFamily:mono, fontSize:'32px', fontWeight:'900', color:C.accent } }, streak),
          React.createElement('div', { style:{ fontSize:'11px', color:C.dim } }, '연속 일수')
        ),
        React.createElement('div', { style:{ width:1, background:C.border, alignSelf:'stretch' } }),
        React.createElement('div', { style:{ flex:2 } },
          React.createElement('div', { style:{ fontSize:'11px', color:C.dim, fontWeight:'700', marginBottom:'6px' } }, 'PR'),
          Object.entries(prs).slice(0,3).map(([name,pr])=>
            React.createElement('div', { key:name, style:{ display:'flex', justifyContent:'space-between', fontSize:'12px', marginBottom:'3px' } },
              React.createElement('span', { style:{ color:C.mid } }, name),
              React.createElement('span', { style:{ color:C.white, fontFamily:mono } }, `${pr.weight}kg×${pr.reps}`)
            )
          )
        )
      ),

      // Weekly chart
      React.createElement('div', { style:cs() },
        React.createElement('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' } },
          React.createElement('div', { style:{ fontSize:'12px', color:C.dim, fontWeight:'700' } }, '주간'),
          React.createElement('div', { style:{ display:'flex', gap:'4px' } },
            React.createElement('button', { onClick:()=>setWkOff(w=>w-1), style:{ background:'none', border:'none', color:C.mid, cursor:'pointer', fontSize:'16px' } }, '‹'),
            React.createElement('span', { style:{ fontSize:'11px', color:C.dim, padding:'0 4px' } }, wkOff===0?'이번주':`${Math.abs(wkOff)}주 ${wkOff<0?'전':'후'}`),
            React.createElement('button', { onClick:()=>setWkOff(w=>w+1), style:{ background:'none', border:'none', color:C.mid, cursor:'pointer', fontSize:'16px' } }, '›')
          )
        ),
        React.createElement(Seg, { options:['volume','sets'], value:analysis.metric, onChange:v=>setAnalysis({...analysis,metric:v}), style:{marginBottom:'12px'} }),
        React.createElement(ResponsiveContainer, { width:'100%', height:140 },
          React.createElement(BarChart, { data:wkData, margin:{top:4,right:4,left:-20,bottom:0} },
            React.createElement(CartesianGrid, { strokeDasharray:'3 3', stroke:'rgba(255,255,255,0.04)', vertical:false }),
            React.createElement(XAxis, { dataKey:'day', tick:{fill:C.dim,fontSize:11} }),
            React.createElement(YAxis, { tick:{fill:C.dim,fontSize:10} }),
            React.createElement(Tooltip, { contentStyle:{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,fontSize:12}, labelStyle:{color:C.mid} }),
            React.createElement(Bar, { dataKey:analysis.metric, fill:C.blue, radius:[4,4,0,0] })
          )
        )
      ),

      // Body weight chart
      wt.length>1 && React.createElement('div', { style:cs() },
        React.createElement('div', { style:{ fontSize:'12px', color:C.dim, fontWeight:'700', marginBottom:'10px' } }, '체중 추이'),
        React.createElement(ResponsiveContainer, { width:'100%', height:120 },
          React.createElement(LineChart, { data:wt, margin:{top:4,right:4,left:-20,bottom:0} },
            React.createElement(CartesianGrid, { strokeDasharray:'3 3', stroke:'rgba(255,255,255,0.04)', vertical:false }),
            React.createElement(XAxis, { dataKey:'date', tick:{fill:C.dim,fontSize:10} }),
            React.createElement(YAxis, { tick:{fill:C.dim,fontSize:10} }),
            React.createElement(Tooltip, { contentStyle:{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,fontSize:12} }),
            React.createElement(Line, { type:'monotone', dataKey:'weight', stroke:C.accent, strokeWidth:2, dot:false })
          )
        )
      ),

      // Exercise history
      React.createElement('div', { style:cs() },
        React.createElement('div', { style:{ fontSize:'12px', color:C.dim, fontWeight:'700', marginBottom:'8px' } }, '운동별 추이'),
        React.createElement('select', { value:analysis.exName, onChange:e=>setAnalysis({...analysis,exName:e.target.value}),
          style:{ ...inp({padding:'8px',fontFamily:sans,fontSize:'13px'}), appearance:'none', cursor:'pointer', marginBottom:'10px' } },
          React.createElement('option', { value:'' }, '운동 선택...'),
          exNames.map(n=>React.createElement('option', { key:n, value:n }, n))
        ),
        exHistory.length>0 && React.createElement(ResponsiveContainer, { width:'100%', height:120 },
          React.createElement(LineChart, { data:exHistory, margin:{top:4,right:4,left:-20,bottom:0} },
            React.createElement(CartesianGrid, { strokeDasharray:'3 3', stroke:'rgba(255,255,255,0.04)', vertical:false }),
            React.createElement(XAxis, { dataKey:'date', tick:{fill:C.dim,fontSize:10} }),
            React.createElement(YAxis, { tick:{fill:C.dim,fontSize:10} }),
            React.createElement(Tooltip, { contentStyle:{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,fontSize:12} }),
            React.createElement(Line, { type:'monotone', dataKey:analysis.metric==='volume'?'vol':'maxW', stroke:C.orange, strokeWidth:2, dot:{fill:C.orange,r:3} })
          )
        )
      )
    );
  };

  // Bottom nav
  const NAV = [
    { id:'record', label:'기록', icon:'📝' },
    { id:'calendar', label:'달력', icon:'📅' },
    { id:'history', label:'히스토리', icon:'📊' },
    { id:'analysis', label:'분석', icon:'📈' }
  ];

  return React.createElement('div', { style:{ background:C.bg, minHeight:'100vh' } },
    tab==='record'   && renderRecord(),
    tab==='calendar' && renderCalendar(),
    tab==='history'  && renderHistory(),
    tab==='analysis' && renderAnalysis(),
    // Bottom nav
    React.createElement('div', { style:{ position:'fixed', bottom:0, left:0, right:0, background:C.bg, borderTop:`1px solid ${C.border}`, display:'flex', paddingBottom:'env(safe-area-inset-bottom)', zIndex:100 } },
      NAV.map(n=>
        React.createElement('button', { key:n.id, onClick:()=>setTab(n.id),
          style:{ flex:1, background:'none', border:'none', cursor:'pointer', padding:'10px 4px', display:'flex', flexDirection:'column', alignItems:'center', gap:'2px' } },
          React.createElement('span', { style:{ fontSize:'20px' } }, n.icon),
          React.createElement('span', { style:{ fontSize:'10px', fontWeight:'700', fontFamily:sans, color: tab===n.id?C.accent:C.dim } }, n.label)
        )
      )
    )
  );
}

window._mountFitLog = () => {
  try {
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FitLog, null));
  } catch(e) {
    console.error('FitLog mount error:', e);
  }
};
// 이미 로그인된 상태로 페이지 로드 시
if (window._uid) window._mountFitLog();
</script>
</body>
</html>
